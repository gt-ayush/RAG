# docker-compose.yml — Local development orchestration for the RAG HTTP service (Phase 15.3).
#
# This file defines service wiring only; it does NOT start any paid provider or
# vector database by default. Copy `.env.example` to `.env`, fill in real
# provider credentials when integrating real adapters, then:
#
#   docker compose up --build
#
# The service reads config from environment at startup; without real provider
# env vars it will fail fast with a non-secret config error (fail-closed).
#
# Source-of-truth keywords: docker compose, local development, service wiring

services:
  rag-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-service:local
    container_name: rag-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=8080
      - HOST=0.0.0.0
      - SHUTDOWN_TIMEOUT_MS=5000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No secrets in the image; all credentials come from .env (gitignored).
    user: "1000:1000"
